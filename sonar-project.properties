sonar.projectKey=ffreis-presentation-compiler
sonar.organization=felipefuhr
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=coverage.out

# ── What this file can and cannot change ────────────────────────────────────
#
# The sonar job here is a pinned reusable workflow
# (ffreis-workflows-go/.github/workflows/go-sonar.yml) and it passes these on
# the scanner command line:
#
#   -Dsonar.sources=.  -Dsonar.tests=.
#   -Dsonar.exclusions=vendor/**,**/*_test.go
#   -Dsonar.test.inclusions=**/*_test.go
#   -Dsonar.go.coverage.reportPaths=coverage.out
#
# A -D argument OVERRIDES this file, so every one of those keys is inert here.
# Setting them anyway is worse than leaving them out: it reads as configuration
# and behaves as decoration. `sonar.coverage.exclusions` below is honoured only
# because the workflow does not pass it.
#
# The consequence to know about: `sonar.test.inclusions` is hardcoded to
# `**/*_test.go`, so NON-GO test code cannot be declared as test code from a
# consumer repo. acceptance/powerpoint/ is a pytest suite -- nothing in the
# compiler imports it and `go build ./...` does not know it exists -- but Sonar
# analyses it as shipped production source, and applies its Python taint rules
# accordingly. Fixing that means teaching go-sonar.yml to respect a repo's own
# properties file, upstream; it is not expressible here.
#
# ── Coverage ────────────────────────────────────────────────────────────────
#
# internal/check/probe.js is browser-evaluated JavaScript handed to Chrome over
# CDP by internal/check. A Go coverage profile cannot contain its lines, so
# Sonar scores every one of them uncovered -- which sank new-code coverage to
# 40% the moment the file was refactored, with no change to how well it is
# actually exercised.
#
# It is not untested: `make check-selftest` renders a deliberately broken deck
# and fails unless ALL EIGHT rules in this file fire, which is a stronger
# guarantee than line coverage of a probe whose whole job is to run inside a
# real layout engine. Unit-testing it would mean adding a JS test runner to a
# Go repo to cover one file.
#
# Scoped to the single file, not a pattern: a second JS file would be a new
# decision, not an inherited exemption.
#
# acceptance/powerpoint/ is here for the same reason, one step worse: this scan
# ingests a Go profile only, so every Python line reads uncovered however well
# tested, and over half of that directory is COM and Win32 code that cannot
# execute off-Windows at all. What does cover it: `make acceptance-test` runs
# 27 tests over the three modules that decide whether a PowerPoint result means
# anything (fixtures, pngcheck, artifacts), and the suite's own negative
# control fails if PowerPoint ever accepts a package with no
# [Content_Types].xml.
#
# The two entry points are orchestration: the shell script is the host-side VM
# lifecycle and the .cmd is the guest-side scheduled-task shim. Both are
# exercised by `--dry-run` and by every failure path having a distinct exit
# code (2 usage, 3 the test never ran), which is what that script is asked to
# get right.
sonar.coverage.exclusions=internal/check/probe.js,acceptance/powerpoint/*.py,scripts/powerpoint-acceptance.sh,acceptance/powerpoint/run-tests.cmd
