sonar.projectKey=ffreis-presentation-compiler
sonar.organization=felipefuhr
sonar.sources=.
sonar.tests=.
# Python test files are tests, not production source. Without this Sonar
# analyses them as shipped code: their lines land in the coverage denominator
# and their assertions raise smells about duplication and complexity.
sonar.test.inclusions=**/*_test.go,acceptance/powerpoint/test_*.py,acceptance/powerpoint/conftest.py
sonar.go.coverage.reportPaths=coverage.out

# internal/check/probe.js is browser-evaluated JavaScript handed to Chrome over
# CDP by internal/check. A Go coverage profile cannot contain its lines, so
# Sonar scores every one of them uncovered — which sank new-code coverage to
# 40% the moment the file was refactored, with no change to how well it is
# actually exercised.
#
# It is not untested: `make check-selftest` renders a deliberately broken deck
# and fails unless ALL EIGHT rules in this file fire, which is a stronger
# guarantee than line coverage of a probe whose whole job is to run inside a
# real layout engine. Unit-testing it would mean adding a JS test runner to a
# Go repo to cover one file.
#
# Scoped to the single file, not a pattern: a second JS file would be a new
# decision, not an inherited exemption.
#
# acceptance/powerpoint/ is the real-PowerPoint harness. Two separate reasons
# it cannot carry a coverage number here, and neither is "it is untested":
#
#   1. This scan ingests one coverage report, and it is a Go profile
#      (sonar.go.coverage.reportPaths above). No Python report is produced or
#      uploaded, so every Python line reads as uncovered no matter how well it
#      is exercised -- which took new-code coverage to 0% and failed the gate.
#      Producing one would mean running pytest inside the scan, and this
#      repo's sonar job is a pinned reusable Go workflow
#      (ffreis-workflows-go/go-sonar.yml); teaching it about Python belongs
#      upstream, not in a consumer repo's properties file.
#   2. Over half of it -- ppt_worker, dialog_guard, the runner -- is COM and
#      Win32 code that cannot execute off-Windows at all, so there is no
#      machine in this repo's CI that could cover it.
#
# What does cover it: `make acceptance-test` runs 27 tests over the three
# portable modules (fixtures, pngcheck, artifacts), which are the ones that
# decide whether a PowerPoint result can be trusted at all; and the suite's
# own negative control fails if PowerPoint ever accepts a package with no
# [Content_Types].xml, which is what proves the Windows half is observing
# anything. The shell and cmd entry points are orchestration, exercised by
# `--dry-run` and by every error path being given a distinct exit code.
sonar.coverage.exclusions=internal/check/probe.js,acceptance/powerpoint/*.py,scripts/powerpoint-acceptance.sh,acceptance/powerpoint/run-tests.cmd
