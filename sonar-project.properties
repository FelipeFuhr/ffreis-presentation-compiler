sonar.projectKey=ffreis-presentation-compiler
sonar.organization=felipefuhr
sonar.sources=.
sonar.tests=.
# acceptance/powerpoint/ is a pytest suite, and ALL of it is test code -- not
# just the test_*.py files. runner.py, ppt_worker.py, dialog_guard.py,
# artifacts.py, fixtures.py, pngcheck.py and prereq.py are the fixtures and
# helpers that suite is built from; none of them is importable by, or shipped
# in, the compiler. `go build ./...` does not know they exist.
#
# Declaring them is a classification, not an exemption, and it has two
# consequences worth being explicit about:
#
#   * Their lines leave the coverage denominator. They have to: this scan
#     ingests a Go profile only (sonar.go.coverage.reportPaths), so every
#     Python line read as uncovered however well tested, which took new-code
#     coverage to 0%. `make acceptance-test` runs 27 tests over the three
#     modules that decide whether a PowerPoint result means anything.
#   * Sonar stops applying its taint rules to them. That is correct for a
#     developer-run harness whose "untrusted input" is a directory the
#     operator named on their own machine -- but the finding that surfaced it
#     was worth acting on anyway, and was: ppt_worker took four separate argv
#     paths and opened each for writing, and now takes one artifacts root with
#     every name below it a constant, contained by artifacts.contain. That
#     change stands on its own merits, independent of this line.
sonar.test.inclusions=**/*_test.go,acceptance/powerpoint/*.py
# ...and the matching half of the same decision. sonar.sources and sonar.tests
# are both "." here, which Sonar documents as an overlap it does not support:
# a file matching both resolves as a SOURCE, so test.inclusions alone changed
# nothing (new_security_rating stayed at 3 and coverage went back to 0%).
# sonar.exclusions applies to sources only, so excluding the directory there
# while including it above is what actually classifies it as test code --
# still analysed, as tests, rather than dropped from analysis.
sonar.exclusions=acceptance/powerpoint/**
sonar.go.coverage.reportPaths=coverage.out

# internal/check/probe.js is browser-evaluated JavaScript handed to Chrome over
# CDP by internal/check. A Go coverage profile cannot contain its lines, so
# Sonar scores every one of them uncovered — which sank new-code coverage to
# 40% the moment the file was refactored, with no change to how well it is
# actually exercised.
#
# It is not untested: `make check-selftest` renders a deliberately broken deck
# and fails unless ALL EIGHT rules in this file fire, which is a stronger
# guarantee than line coverage of a probe whose whole job is to run inside a
# real layout engine. Unit-testing it would mean adding a JS test runner to a
# Go repo to cover one file.
#
# Scoped to the single file, not a pattern: a second JS file would be a new
# decision, not an inherited exemption.
#
# The PowerPoint harness's two entry points are orchestration, not product
# code, and no coverage tool in this repo observes either: the shell script is
# the host-side VM lifecycle and the .cmd is the guest-side scheduled-task
# shim. Both are exercised by `--dry-run` and by every failure path being
# given a distinct exit code (2 usage, 3 the test never ran), which is what
# that script is actually asked to get right. The harness's Python is covered
# by sonar.test.inclusions above instead.
sonar.coverage.exclusions=internal/check/probe.js,scripts/powerpoint-acceptance.sh,acceptance/powerpoint/run-tests.cmd
