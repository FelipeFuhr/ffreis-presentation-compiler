name: Markdownlint

on:
  pull_request:
    # Something in this chain skips on a draft PR. Without ready_for_review
    # the job is never re-triggered when the PR is promoted, so the check
    # settles as SKIPPED and reads as green having never run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["**/*.md"]
  push:
    branches: [main, master, develop]
    paths: ["**/*.md"]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-markdownlint.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da # v1.8.1
    permissions:
      contents: read
