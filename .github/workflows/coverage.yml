name: Code Coverage (Codecov)

on:
  pull_request:
    # Something in this chain skips on a draft PR. Without ready_for_review
    # the job is never re-triggered when the PR is promoted, so the check
    # settles as SKIPPED and reads as green having never run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  coverage:
    if: ${{ !github.event.pull_request.draft }}

    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@e9b9cc0cde6465b785f4b7c71d2180f5b265f42f
    with:
      go-version: "1.26.10"
      working-directory: "."
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
