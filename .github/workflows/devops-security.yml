name: DevOps / Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 5 25-31 * 0"  # last Sunday of month, 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-fs:
    permissions:
      contents: read
      actions: read
      security-events: write
    # Consolidated fs-security bundle: Trivy(fs) + Grype(fs) + gitleaks in ONE job
    # (was 3 separate jobs). upload-sarif off: GHAS/code-scanning not enabled.
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-security-fs.yml@3c4c9012ea1e8edfda316cf0d87052b33e5fa3fe # v2.1.0
    with:
      runner: '["ubuntu-latest"]'
      working-directory: "."
      scan-history: true
      upload-sarif: false
  codeql:
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@3c4c9012ea1e8edfda316cf0d87052b33e5fa3fe # v2.1.0
    with:
      runner: '["ubuntu-latest"]'
      languages: "go"
      source-root: "."

  govulncheck:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-security.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.26.9"
      # The callee runs govulncheck under its OWN toolchain input, which
      # defaults to 1.26.8 — still carrying GO-2026-6617 et al, all fixed at
      # 1.26.9. Without this the job fails on stdlib CVEs regardless of
      # go-version above.
      govulncheck-go-version: "1.26.9"
      working-directory: "."

  semgrep:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-semgrep-sarif.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      working-directory: "."
      upload-sarif: false


  osv:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-osv-scanner.yml@3c4c9012ea1e8edfda316cf0d87052b33e5fa3fe # v2.1.0
    with:
      runner: '["ubuntu-latest"]'
      working-directory: "."
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}


  lint:
    permissions:
      contents: read
      pull-requests: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.26.9"
      working-directory: "."
