name: DevOps / Go CI

on:
  pull_request:
    # `test` and `integration` below are gated on the PR not being a draft, so
    # without ready_for_review they are never re-triggered at promotion and the
    # check reads green having never run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  mod-tidy:
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.25.8"
      working-directory: "."

  fmt:
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.25.8"
      working-directory: "."

  lint:
    needs: [fmt]
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.25.8"
      working-directory: "."

  test:
    if: ${{ !github.event.pull_request.draft }}

    needs: [fmt]
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.25.8"
      working-directory: "."
      run-govulncheck: false

  integration:
    if: ${{ !github.event.pull_request.draft }}

    needs: [fmt]
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@7e462f7c9dc4b224f769582878f69b433d73e7ed # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      go-version: "1.25.8"
      working-directory: "."
      test-tags: "integration"
      run-govulncheck: false
